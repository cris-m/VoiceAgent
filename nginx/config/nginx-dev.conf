worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;

    log_format custom '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" "$gzip_ratio"';

    proxy_cache_path /etc/nginx/cache keys_zone=app_cache:10m
                     levels=1:2 inactive=600s max_size=100m use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default Upgrade;
        '' close;
    }

    # Dynamic DNS resolution for Docker service discovery.
    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    upstream client {
        server client:3000 fail_timeout=300s max_fails=5;
        keepalive 32;
    }

    upstream backend {
        server backend:8000 fail_timeout=300s max_fails=5;
        keepalive 32;
    }

    upstream agent {
        server agent:8000 fail_timeout=300s max_fails=5;
        keepalive 32;
    }

    server {
        charset UTF-8;

        error_log /var/log/nginx/error.log debug;
        access_log /var/log/nginx/access.log custom;

        listen 80 default_server;
        listen [::]:80 default_server;

        server_name localhost;
        server_name_in_redirect off;
        server_tokens off;
        port_in_redirect off;

        client_header_timeout 30;

        # Vite dev server handles HMR internally via WebSocket injection.
        location / {
            proxy_pass http://client/;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket support for HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long timeouts for dev mode
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_cache off;
            proxy_buffering off;
        }

        # Generated narrations and music live on the backend's filesystem;
        # the backend returns URLs like /static/narrations/<uuid>.wav.
        location /static/ {
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend;
            # Don't cache audio so a regenerated file isn't served stale.
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Must come before /api/v1/.
        location /api/v1/voice/ws {
            proxy_pass http://backend/api/v1/voice/ws;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache off;
            proxy_buffering off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /api/v1/ {
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend/api/v1/;
            default_type application/json;
        }

        location /api/ {
            include /etc/nginx/proxy.conf;
            proxy_pass http://agent/;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Service "langgraph";
        }

        location /ws/ {
            proxy_pass http://agent/ws/;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache off;
            proxy_buffering off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
