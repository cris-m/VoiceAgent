# HTTP only — TLS is expected to be terminated by an upstream load balancer / CDN.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;

    log_format custom '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" "$gzip_ratio"';

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json;

    proxy_cache_path /etc/nginx/cache keys_zone=app_cache:10m
                     levels=1:2 inactive=600s max_size=100m use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default Upgrade;
        '' close;
    }

    upstream backend {
        server backend:8000 fail_timeout=300s max_fails=5;
        keepalive 32;
    }

    upstream agent {
        server agent:8000 fail_timeout=300s max_fails=5;
        keepalive 32;
    }

    server {
        charset UTF-8;

        error_log /var/log/nginx/error.log error;
        access_log /var/log/nginx/access.log custom;

        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;
        server_name_in_redirect off;
        server_tokens off;
        port_in_redirect off;

        client_header_timeout 30;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Must come before /api/v1/.
        location /api/v1/voice/ws {
            proxy_pass http://backend/api/v1/voice/ws;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache off;
            proxy_buffering off;
            proxy_read_timeout 86400;  # 24 hours
            proxy_send_timeout 86400;
        }

        location /static/ {
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend;
            # Don't cache audio so a regenerated file isn't served stale.
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /api/v1/ {
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend;
            default_type application/json;
        }

        location /api/ {
            include /etc/nginx/proxy.conf;
            proxy_pass http://agent/;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Service "langgraph";
        }

        location /ws/ {
            proxy_pass http://agent/ws/;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache off;
            proxy_buffering off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|svg|webp)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
            }

            # Don't cache HTML — always revalidate
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }

            try_files $uri $uri/ /index.html;
        }
    }
}
