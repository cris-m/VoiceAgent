[project]
name = "voiceagent"
version = "0.1.0"
description = "Real-time voice agent backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    # Audio
    "soundfile>=0.12.0",
    "sounddevice>=0.5.0",
    "pydub>=0.25.1",
    "torch>=2.5.0",
    "torchaudio>=2.0.0",
    # Music — MusicGen via HuggingFace transformers (downloads facebook/musicgen-small on first run)
    "transformers>=4.40.0",
    # STT — faster-whisper (local, CTranslate2-optimized)
    # Kyutai STT-1B is supported but requires manual install (see services/stt/kyutai_stt.py)
    "faster-whisper>=1.0.0",
    "librosa>=0.11.0",
    # TTS — Kokoro (82M ONNX, ~300ms first byte) and Pocket TTS (100M, ~200ms, voice cloning)
    "kokoro-onnx>=0.4.0",
    "ml-dtypes>=0.5.0",
    "onnx>=1.17.0,<1.19.0",
    "onnxruntime>=1.17.0",
    "pocket-tts>=0.1.0",
    "httpx>=0.27.0",
    "websockets>=15.0.1",
    # LangGraph
    "langgraph-sdk>=0.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    # Authentication
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.0.0",
    # Token Blacklist & Caching
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]


[project.scripts]
voiceagent = "cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true

[tool.pythonpath]
paths = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["api", "cli", "config", "core", "models", "schemas", "services", "utils", "websocket"]
