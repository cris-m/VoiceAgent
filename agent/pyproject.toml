[project]
name = "voice-agent"
version = "0.1.0"
description = "AI voice agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "deepagents>=0.3.7",
    "tavily-python>=0.7.19",
    "langchain-openai>=1.1.7",
    "langchain-ollama>=1.0.1",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langgraph-api>=0.6.39",
    "langchain-community>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "duckduckgo-search>=7.0.0",
]
[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.3.4",
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
