x-common-env: &common-env
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  start_period: 10s
  retries: 3

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - .env
    - ./backend/.env
  networks:
    - api-network
    - private-network
  restart: unless-stopped
  tty: true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    agent:
      condition: service_healthy

services:

  client:
    container_name: voiceagent-client
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NODE_ENV: "${NODE_ENV:-production}"
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
    expose:
      - "3000"   # Internal only - accessed by nginx
    env_file:
      - .env
    volumes:
      - "${DOCKER_CLIENT_VOLUME:-./client:/app}"
      - /app/node_modules
    networks:
      - public-network
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ | grep -q 'html' || exit 1"]
    profiles:
      - client

  nginx:
    container_name: voiceagent-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        NODE_ENV: "${NODE_ENV:-production}"
    ports:
      - "${NGINX_PORT:-8080}:80"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks:
      - public-network
      - api-network
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost/health || exit 1"]
    profiles:
      - nginx

  backend:
    <<: *backend-base
    container_name: voiceagent-backend
    expose:
      - "8000"
    volumes:
      - "${DOCKER_BACKEND_VOLUME:-./backend:/app}"
      - model-cache:/home/appuser/.cache
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
    profiles:
      - server

  agent:
    container_name: voiceagent-agent
    build:
      context: ./agent
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - .env
      - ./agent/.env
    volumes:
      - "${DOCKER_AGENT_VOLUME:-./agent:/deps}"
    networks:
      - api-network
      - private-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ok')"]
    profiles:
      - agent

  postgres:
    container_name: voiceagent-postgres
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-voiceagent}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private-network
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    profiles:
      - postgres

  redis:
    container_name: voiceagent-redis
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - private-network
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    profiles:
      - redis

networks:
  public-network:
    driver: bridge
    name: voiceagent-public

  api-network:
    driver: bridge
    name: voiceagent-api

  private-network:
    driver: bridge
    name: voiceagent-private

volumes:
  postgres-data:
    name: voiceagent-postgres-data

  model-cache:
    name: voiceagent-model-cache
